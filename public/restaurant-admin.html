<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الطعام - المنيو</title>
  <style>
    :root {
      --primary-color: #0f2537;
      --secondary-color: #e5d5be;
      --card-bg: #d7c4a8;
      --text-color: #1f1912;       /* لون النص العام */
      --header-bg: #ffffff;        /* لون الهيدر / شريط التنقل */
      --heading-color: #1a1a1a;    /* لون العناوين واسم المطعم */
      --card-border: #cccccc;      /* لون حدود كروت المنتجات */
      --button-text: #ffffff;      /* لون نص الأزرار */
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--secondary-color);
      color: var(--text-color); /* تطبيق لون النص العام على كل الصفحة */
      margin: 0;
      padding: 0;
    }

    /* 1. جميع النصوص والعناصر ترث لون النص العام تلقائياً، ما عدا المستثناة أسفل */
    p, span, li, a, label, div, .description, .price, .item-text {
      color: var(--text-color);
    }

    /* 2. استثناء اسم المطعم والعناوين الرئيسية والفرعية لتكون مرتبطة بـ "لون العناوين" */
    h1, h2, h3, h4, h5, h6, 
    .section-title, 
    .restaurant-title, 
    .restaurant-name {
      color: var(--heading-color) !important;
    }

    /* الهيدر أو شريط التنقل العلوي */
    header, .navbar, .top-bar {
      background-color: var(--header-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* كروت المنتجات والأقسام */
    .menu-card, .item-card, .category-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    /* الأزرار */
    button, .btn, .order-btn, .add-to-cart-btn {
      background-color: var(--primary-color);
      color: var(--button-text); /* لون نص الأزرار المخصص */
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- الهيدر أو شريط التنقل -->
  <header>
    <div>
      <h1 class="restaurant-name" id="display-res-name" style="margin: 0; font-size: 24px;">اسم المطعم</h1>
      <p id="display-res-tagline" style="margin: 5px 0 0 0; font-size: 14px;">الوصف الفرعي</p>
    </div>
  </header>

  <div class="container">
    <div id="menu-container">
      <p>جاري تحميل المنيو...</p>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    // جلب الإعدادات وتطبيق الألوان والمتغيرات ديناميكياً
    async function loadClientSettings() {
      try {
        const res = await fetch(`${API_URL}/settings`);
        if (res.ok) {
          const settings = await res.json();
          
          // تطبيق الألوان على متغيرات الـ CSS
          if (settings.primaryColor) document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
          if (settings.secondaryColor) document.documentElement.style.setProperty('--secondary-color', settings.secondaryColor);
          if (settings.cardBgColor) document.documentElement.style.setProperty('--card-bg', settings.cardBgColor);
          if (settings.textColor) document.documentElement.style.setProperty('--text-color', settings.textColor);
          
          // الألوان المتقدمة الجديدة
          if (settings.headerBgColor) document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
          if (settings.headingColor) document.documentElement.style.setProperty('--heading-color', settings.headingColor);
          if (settings.cardBorderColor) document.documentElement.style.setProperty('--card-border', settings.cardBorderColor);
          if (settings.buttonTextColor) document.documentElement.style.setProperty('--button-text', settings.buttonTextColor);

          // تعبئة النصوص الخاصة باسم المطعم والشعار
          if (settings.restaurantName) {
            document.getElementById('display-res-name').textContent = settings.restaurantName;
          }
          if (settings.restaurantTagline || settings.tagline) {
            document.getElementById('display-res-tagline').textContent = settings.restaurantTagline || settings.tagline;
          }
        }
      } catch (err) {
        console.error("فشل تحميل إعدادات المظهر:", err);
      }
    }

    // دالة جلب وعرض الأقسام والمنتجات
    async function loadMenu() {
      try {
        const res = await fetch(`${API_URL}/menu`);
        if (res.ok) {
          const categories = await res.json();
          const container = document.getElementById('menu-container');
          container.innerHTML = '';

          if (categories.length === 0) {
            container.innerHTML = '<p>لا توجد منتجات مضافة حالياً في المنيو.</p>';
            return;
          }

          categories.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.className = 'menu-card';
            
            let itemsHtml = '';
            if (cat.items && cat.items.length > 0) {
              itemsHtml = cat.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px dashed var(--card-border); padding-top: 10px;">
                  <div>
                    <h4 style="margin: 0; font-size: 16px;">${item.name}</h4>
                    <p class="description" style="margin: 3px 0; font-size: 13px;">${item.description || ''}</p>
                    <span class="price" style="font-weight: bold; font-size: 14px;">${item.price} د.ع</span>
                  </div>
                  <button class="add-to-cart-btn">طلب الصنف</button>
                </div>
              `).join('');
            } else {
              itemsHtml = '<p style="font-size: 13px; margin: 5px 0;">لا توجد أصناف في هذا القسم.</p>';
            }

            catDiv.innerHTML = `
              <h3 class="section-title" style="margin-top: 0; border-bottom: 2px solid var(--card-border); padding-bottom: 5px;">${cat.name}</h3>
              <div>${itemsHtml}</div>
            `;
            container.appendChild(catDiv);
          });
        }
      } catch (err) {
        console.error("فشل تحميل المنيو:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadClientSettings();
      loadMenu();
    });
  </script>
</body>
</html>
