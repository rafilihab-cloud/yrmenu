<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو الرقمي</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الغلاف واللوجو -->
  <div class="header-cover">
    <div class="logo-container">
      <img src="https://via.placeholder.com/100" id="restaurant-logo" alt="Logo">
    </div>
  </div>

  <div class="container">
    <h1 id="restaurant-name">جاري التحميل...</h1>

    <!-- شريط الأقسام الأفقي -->
    <div class="categories-tab" id="categories-tab"></div>

    <!-- قائمة الوجبات -->
    <div id="menu-container"></div>
  </div>

  <script>
    fetch('/api/menu')
      .then(res => res.json())
      .then(data => {
        document.getElementById('restaurant-name').innerText = data.restaurantName;
        
        const tabsContainer = document.getElementById('categories-tab');
        const menuContainer = document.getElementById('menu-container');

        data.categories.forEach((category, index) => {
          // إضافة زر القسم للـ Scroll الأفقي
          const tabBtn = document.createElement('button');
          tabBtn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
          tabBtn.innerText = category.name;
          tabBtn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            tabBtn.classList.add('active');
            document.getElementById(`category-${index}`).scrollIntoView({ behavior: 'smooth' });
          };
          tabsContainer.appendChild(tabBtn);

          // إضافة كروت الوجبات
          let categoryHtml = `
            <div class="category-section" id="category-${index}">
              <h2 class="category-title">${category.name}</h2>
              <div class="items-grid">
          `;

          category.items.forEach(item => {
            categoryHtml += `
              <div class="item-card">
                <div class="item-details">
                  <h3 class="item-name">${item.name}</h3>
                  <p class="item-desc">${item.desc}</p>
                  <span class="item-price">${item.price}</span>
                </div>
                <div class="item-image">
                  <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name}">
                </div>
              </div>
            `;
          });

          categoryHtml += `</div></div>`;
          menuContainer.innerHTML += categoryHtml;
        });
      });
  </script>
</body>
</html>
