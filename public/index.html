<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home Page</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* تنسيق فيديو الخلفية وطبقة التظليل دون التأثير على باقي المحتوى */
    body.home-page {
      position: relative;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .hero-video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
      display: none;
    }

    /* طبقة شفافة اختيارية لضمان وضوح النصوص فوق الفيديو */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
      display: none;
    }

    /* التأكد من بقاء محتوى الصفحة فوق الفيديو واستقبال اللمسات */
    .home-header {
      position: relative;
      z-index: 999;
      pointer-events: auto !important;
    }

    /* تم تعديل الحاوية لملء الشاشة ومنع ظهور أي فراغات سفلية */
    .hero-content {
      position: relative;
      z-index: 10;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 20px;
    }

    /* حاوية مخصصة لرفع النصوص وحدها للأعلى بالمسافة التي تريدها */
    .hero-texts-wrapper {
      transform: translateY(+1cm); /* يمكنك تغيير هذه القيمة لزيادة أو تقليل الارتفاع للنصوص */
      background: transparent;
      isolation: isolate;
      text-align: center;
    }

    /* حاوية مخصصة لتحريك الأزرار وروابط التواصل وحدها للأعلى أو للأسفل */
    .hero-actions-wrapper {
      transform: translateY(+1cm); /* قم بتعديل هذه القيمة (مثلاً -2cm أو 2cm) لتحريك الأزرار وحدها */
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      isolation: isolate;
    }

    /* --- تعديل علامة الماركة لتكون خلفية بيضاء وكتابة سوداء --- */
    .brand-badge {
      background-color: #ffffff !important;
      color: #000000 !important;
    }

    /* --- قائمة اختيار اللغة التفاعلية المخصصة --- */
    .lang-dropdown {
      position: relative;
      display: inline-block;
      z-index: 9999 !important;
      pointer-events: auto !important;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 50px;
      background-color: var(--primary, #0f2537) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
    }

    .lang-btn:hover {
      background-color: var(--secondary, #e5d5be) !important;
      color: var(--primary, #0f2537) !important;
    }

    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background-color: #ffffff !important;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      list-style: none;
      padding: 6px 0;
      margin: 0;
      min-width: 140px;
      display: none;
      z-index: 99999 !important;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.1);
      pointer-events: auto !important;
    }

    .lang-menu.show {
      display: block !important;
    }

    .lang-menu li {
      padding: 10px 16px;
      color: #333333 !important;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .lang-menu li:hover {
      background-color: #f3f4f6 !important;
      color: var(--primary, #0f2537) !important;
    }

    .lang-menu li.active {
      color: var(--primary, #0f2537) !important;
      font-weight: 700;
      background-color: #eef2f6 !important;
    }
  </style>
</head>
<body class="home-page">

  <!-- فيديو الخلفية -->
  <video id="bg-video-player" class="hero-video-bg" autoplay loop muted playsinline>
    <source id="bg-video-source" src="" type="video/mp4">
  </video>
  <div id="video-overlay" class="video-overlay"></div>

  <!-- Header / Navigation -->
  <header class="home-header">
    <div class="lang-dropdown">
      <button class="lang-btn" id="langBtn" type="button">
        <i class="fa-solid fa-globe"></i>
        <span id="currentLangText">العربية</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 11px;"></i>
      </button>
      <ul class="lang-menu" id="langMenu">
        <li data-lang="ar" id="opt-ar">العربية</li>
        <li data-lang="en" id="opt-en">English</li>
      </ul>
    </div>
  </header>

  <!-- Hero Content Section -->
  <main class="hero-content">
    <!-- حاوية النصوص وحدها -->
    <div class="hero-texts-wrapper">
      <p class="hero-subtitle" id="txt-subtitle">أهلاً بكم في</p>
      
      <!-- اسم المطعم الديناميكي -->
      <h1 class="hero-title" id="display-res-name"></h1>
      
      <p class="hero-tagline" id="txt-tagline">طعم لا يُنسى وذكريات جميلة</p>
    </div>

    <!-- حاوية الأزرار وروابط التواصل وحدها (يمكنك تحريكها عبر الـ CSS بالأعلى) -->
    <div class="hero-actions-wrapper">
      <!-- زر للانتقال إلى القائمة -->
      <a href="menu.html" class="menu-action-btn">
        <span id="txt-btn-menu">عرض المنيو</span>
        <i class="fa-solid fa-arrow-left" id="btn-arrow"></i>
      </a>

      <!-- روابط التواصل الاجتماعي -->
      <div class="social-icons">
        <a href="#" class="social-btn"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-snapchat"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook"></i></a>
      </div>

      <!-- علامة الماركة / Brand Badge -->
      <div class="brand-badge">YRmenu</div>
    </div>
  </main>

  <!-- JavaScript Code -->
  <script>
    const API_URL = '/api';

    const translations = {
      ar: {
        subtitle: "أهلاً بكم في",
        tagline: "طعم لا يُنسى وذكريات جميلة",
        btnMenu: "عرض المنيو"
      },
      en: {
        subtitle: "Welcome to",
        tagline: "Unforgettable taste & beautiful memories",
        btnMenu: "View Menu"
      }
    };

    function applyLanguage(lang) {
      const htmlEl = document.documentElement;
      const currentLangText = document.getElementById('currentLangText');
      const optAr = document.getElementById('opt-ar');
      const optEn = document.getElementById('opt-en');

      htmlEl.setAttribute('dir', 'ltr');

      if (lang === 'en') {
        if (currentLangText) currentLangText.innerText = 'English';
        if (optAr) optAr.classList.remove('active');
        if (optEn) optEn.classList.add('active');

        htmlEl.setAttribute('lang', 'en');

        document.getElementById('txt-subtitle').innerText = translations.en.subtitle;
        document.getElementById('txt-tagline').innerText = translations.en.tagline;
        document.getElementById('txt-btn-menu').innerText = translations.en.btnMenu;
      } else {
        if (currentLangText) currentLangText.innerText = 'العربية';
        if (optEn) optEn.classList.remove('active');
        if (optAr) optAr.classList.add('active');

        htmlEl.setAttribute('lang', 'ar');

        document.getElementById('txt-subtitle').innerText = translations.ar.subtitle;
        document.getElementById('txt-tagline').innerText = translations.ar.tagline;
        document.getElementById('txt-btn-menu').innerText = translations.ar.btnMenu;
      }

      localStorage.setItem('selectedLang', lang);
    }

    const langBtn = document.getElementById('langBtn');
    const langMenu = document.getElementById('langMenu');

    function toggleMenu(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      langMenu.classList.toggle('show');
    }

    if (langBtn && langMenu) {
      langBtn.addEventListener('click', toggleMenu);

      langMenu.querySelectorAll('li').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const selectedLang = e.currentTarget.getAttribute('data-lang');
          applyLanguage(selectedLang);
          langMenu.classList.remove('show');
        });
      });

      document.addEventListener('click', (e) => {
        if (!langBtn.contains(e.target) && !langMenu.contains(e.target)) {
          langMenu.classList.remove('show');
        }
      });
    }

    async function loadHomeSettings() {
      try {
        const res = await fetch(`${API_URL}/settings?t=${new Date().getTime()}`, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error("فشل جلب البيانات من السيرفر");
        
        const settings = await res.json();

        if (settings) {
          const status = (settings.subscriptionStatus || settings.status || settings.subscription_status || '').toLowerCase();
          const isActive = settings.isActive !== undefined ? settings.isActive : settings.is_active;
          
          const isDisabled = status === 'disabled' || status === 'inactive' || status === 'expired' || isActive === false || settings.disabled === true;

          const expiry = settings.expiryDate || settings.expiry_date || settings.expirationDate;
          let isExpired = false;
          if (expiry) {
            const today = new Date().toISOString().split('T')[0];
            const expiryFormatted = new Date(expiry).toISOString().split('T')[0];
            if (expiryFormatted < today) {
              isExpired = true;
            }
          }

          if (isDisabled || isExpired) {
            document.body.innerHTML = `
              <div style="text-align: center; padding: 50px 20px; font-family: system-ui, -apple-system, sans-serif; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; color: #333;">
                <h1 style="font-size: 48px; margin-bottom: 10px;">⚠️</h1>
                <h2 style="color: #e74c3c; margin-bottom: 10px;">عذراً، الخدمة غير متاحة حالياً</h2>
                <p style="color: #666; max-width: 400px; line-height: 1.6;">تم إيقاف المنيو مؤقتاً بسبب انتهاء فترة الاشتراك أو للتعطيل الصيانة. يرجى مراجعة إدارة المطعم.</p>
              </div>
            `;
            return;
          }

          if (settings.restaurantName) {
            document.getElementById('display-res-name').innerText = settings.restaurantName;
          }

          const videoPlayer = document.getElementById('bg-video-player');
          const videoSource = document.getElementById('bg-video-source');
          const videoOverlay = document.getElementById('video-overlay');

          if (settings.heroVideoUrl) {
            const videoUrl = (settings.heroVideoUrl.startsWith('data:') || settings.heroVideoUrl.startsWith('http')) 
              ? settings.heroVideoUrl 
              : (settings.heroVideoUrl.startsWith('/') ? settings.heroVideoUrl : `/${settings.heroVideoUrl}`);
              
            videoSource.src = videoUrl;
            videoPlayer.load();
            videoPlayer.style.display = 'block';
            if (videoOverlay) videoOverlay.style.display = 'block';
            document.body.style.backgroundImage = 'none';
          } else if (settings.heroBgUrl) {
            const bgUrl = (settings.heroBgUrl.startsWith('data:') || settings.heroBgUrl.startsWith('http'))
              ? settings.heroBgUrl
              : (settings.heroBgUrl.startsWith('/') ? settings.heroBgUrl : `/${settings.heroBgUrl}`);
              
            videoPlayer.style.display = 'none';
            if (videoOverlay) videoOverlay.style.display = 'none';
            document.body.style.backgroundImage = `url('${bgUrl}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
          }

          const root = document.documentElement;
          if (settings.primaryColor) root.style.setProperty('--primary', settings.primaryColor);
          if (settings.secondaryColor) root.style.setProperty('--secondary', settings.secondaryColor);
          if (settings.cardBgColor) root.style.setProperty('--card-bg', settings.cardBgColor);
          if (settings.textColor) root.style.setProperty('--text-dark', settings.textColor);
        }
      } catch (err) {
        console.error("خطأ في تحميل إعدادات الصفحة الرئيسية:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('selectedLang') || 'ar';
      applyLanguage(savedLang);
      loadHomeSettings();
    });
  </script>
</body>
</html>
