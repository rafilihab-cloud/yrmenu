<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YRmenu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Banner Header -->
  <header class="hero-banner">
    <div class="logo-container">
      <img src="images/logo.png" alt="YRmenu Logo" class="restaurant-logo" onerror="this.onerror=null; this.src='https://placehold.co/100x100/2c5364/ffffff?text=YRmenu';">
    </div>
  </header>

  <!-- Restaurant Information -->
  <section class="restaurant-info">
    <h1 class="restaurant-name">YRmenu</h1>
  </section>

  <!-- Categories Filter Navigation -->
  <nav class="categories-nav" id="categories-nav">
    <!-- سيتم إضافة تصنيفات القائمة ديناميكياً -->
  </nav>

  <!-- Menu Display Section -->
  <main class="menu-container" id="menu-container">
    <div class="loading-state">جاري التحميل...</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
