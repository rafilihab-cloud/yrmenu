<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - لوحة التحكم</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    h2 { margin-top: 0; text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .error-msg { color: #e74c3c; text-align: center; margin-top: 10px; font-size: 14px; display: none; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>🔒 دخول الإدارة</h2>
  <form id="login-form">
    <div class="form-group">
      <label>اسم المستخدم:</label>
      <input type="text" id="username" required placeholder="ادخل اسم المستخدم">
    </div>
    <div class="form-group">
      <label>كلمة السر:</label>
      <input type="password" id="password" required placeholder="ادخل كلمة السر">
    </div>
    <button type="submit">تسجيل الدخول</button>
    <div id="error" class="error-msg"></div>
  </form>
</div>

<script>
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('error');
    errorDiv.style.display = 'none';

    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });

    const data = await response.json();
    if (response.ok) {
      window.location.href = '/admin.html';
    } else {
      errorDiv.innerText = data.error;
      errorDiv.style.display = 'block';
    }
  };
</script>

</body>
</html>
