<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo1.png">
  <link rel="apple-touch-icon" href="images/logo1.png">
  <meta charset="UTF-8">
  <title id="page-title">Login Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; position: relative; }
    .lang-container { position: absolute; top: 20px; left: 20px; }
    .select-lang { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; font-weight: bold; font-size: 14px; cursor: pointer; }
    .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    h2 { margin-top: 0; text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button[type="submit"] { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button[type="submit"]:hover { opacity: 0.9; }
    .error-msg { color: #e74c3c; text-align: center; margin-top: 10px; font-size: 14px; display: none; }
  </style>
</head>
<body>

<div class="lang-container">
  <select id="lang-select" class="select-lang" onchange="changeLanguage(this.value)">
    <option value="ar">العربية</option>
    <option value="en">English</option>
  </select>
</div>

<div class="login-card">
  <h2 id="login-title">🔒 دخول الإدارة</h2>
  <form id="login-form">
    <div class="form-group">
      <label id="label-username">اسم المستخدم:</label>
      <input type="text" id="username" required placeholder="ادخل اسم المستخدم">
    </div>
    <div class="form-group">
      <label id="label-password">كلمة السر:</label>
      <input type="password" id="password" required placeholder="ادخل كلمة السر">
    </div>
    <button type="submit" id="submit-btn">تسجيل الدخول</button>
    <div id="error" class="error-msg"></div>
  </form>
</div>

<script>
  const translations = {
    ar: {
      pageTitle: "Login Admin",
      loginTitle: "🔒 دخول الإدارة",
      labelUsername: "اسم المستخدم:",
      placeholderUsername: "ادخل اسم المستخدم",
      labelPassword: "كلمة السر:",
      placeholderPassword: "ادخل كلمة السر",
      submitBtn: "تسجيل الدخول",
      errorConnection: "حدث خطأ في الاتصال بالسيرفر",
      errorInvalid: "اسم المستخدم أو كلمة المرور غير صحيحة"
    },
    en: {
      pageTitle: "Admin Login",
      loginTitle: "🔒 Admin Login",
      labelUsername: "Username:",
      placeholderUsername: "Enter username",
      labelPassword: "Password:",
      placeholderPassword: "Enter password",
      submitBtn: "Login",
      errorConnection: "Server connection error",
      errorInvalid: "Invalid username or password"
    }
  };

  let currentErrorInvalidText = translations['ar'].errorInvalid;
  let currentErrorConnText = translations['ar'].errorConnection;

  function setLanguage(lang) {
    localStorage.setItem('preferred_language', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    const t = translations[lang];
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('login-title').innerText = t.loginTitle;
    document.getElementById('label-username').innerText = t.labelUsername;
    document.getElementById('username').placeholder = t.placeholderUsername;
    document.getElementById('label-password').innerText = t.labelPassword;
    document.getElementById('password').placeholder = t.placeholderPassword;
    document.getElementById('submit-btn').innerText = t.submitBtn;

    document.getElementById('lang-select').value = lang;

    currentErrorInvalidText = t.errorInvalid;
    currentErrorConnText = t.errorConnection;
  }

  function changeLanguage(lang) {
    setLanguage(lang);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('preferred_language') || 'ar';
    setLanguage(savedLang);
  });

  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('error');
    errorDiv.style.display = 'none';

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      const data = await response.json();
      
      if (response.ok && (data.success || data.token || response.status === 200)) {
        localStorage.setItem('isAdminLoggedIn', 'true');
        
        // التقاط الـ store من الرابط الحالي لصفحة تسجيل الدخول
        const urlParams = new URLSearchParams(window.location.search);
        const store = urlParams.get('store');

        // توجيه المستخدم إلى صفحة الإدارة مع الاحتفاظ بالمتجر إن وجد
        let redirectUrl = 'admin.html';
        if (store) {
          redirectUrl += `?store=${encodeURIComponent(store)}`;
        }
        window.location.href = redirectUrl;

      } else {
        errorDiv.innerText = data.error || currentErrorInvalidText;
        errorDiv.style.display = 'block';
      }
    } catch (err) {
      console.error(err);
      errorDiv.innerText = currentErrorConnText;
      errorDiv.style.display = 'block';
    }
  };
</script>

</body>
</html>
