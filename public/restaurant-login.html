<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login restaurant</title>
  <style>
    :root {
      --primary: #27ae60;
      --secondary: #2c3e50;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .login-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1a1a1a;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      border-color: var(--primary);
      outline: none;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 5px;
    }
    .btn-login:hover {
      opacity: 0.9;
    }
    #error-msg {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h2>🔐 دخول أصحاب المطاعم</h2>
  <form id="login-form">
    <div class="form-group">
      <label for="username">اسم المستخدم:</label>
      <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" required placeholder="أدخل كلمة المرور">
    </div>
    <button type="submit" class="btn-login">تسجيل الدخول</button>
    <div id="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة</div>
  </form>
</div>

<script>
  const API_URL = '/api';

  // إذا كان صاحب المطعم مسجل الدخول مسبقاً، نوجهه مباشرة للوحة التحكم
  if (localStorage.getItem('isRestaurantLoggedIn') === 'true') {
    window.location.href = 'restaurant-admin.html'; // استبدل الاسم بملف لوحة التحكم إذا كان مختلفاً
  }

  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    errorMsg.style.display = 'none';

    try {
      const res = await fetch(`${API_URL}/restaurant-login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const data = await res.json();
        // تخزين حالة الدخول الخاصة بلوحة المطعم
        localStorage.setItem('isRestaurantLoggedIn', 'true');
        if (data.token) {
          localStorage.setItem('restaurantToken', data.token);
        }
        // الانتقال إلى لوحة التحكم
        window.location.href = 'restaurant-admin.html';
      } else {
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      console.error(err);
      errorMsg.textContent = 'حدث خطأ في الاتصال بالخادم.';
      errorMsg.style.display = 'block';
    }
  };
</script>

</body>
</html>
