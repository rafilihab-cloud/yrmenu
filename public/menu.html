<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YRmenu - Menu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @keyframes fadeInUpStagger {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #menu-container {
      perspective: 1000px;
      margin-top: 35px;
    }

    #menu-container > * {
      opacity: 0;
      animation: fadeInUpStagger 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--stagger-delay, 0s);
      will-change: transform, box-shadow, opacity;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      border-radius: 16px;
      cursor: pointer;
      /* تطبيق لون الحدود المخصص للكروت إذا توفر */
      border: 1px solid var(--card-border, transparent);
    }

    #menu-container > *:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.08);
      z-index: 2;
    }

    /* ===================================================
        تنسيقات شريط الأقسام الملتصق وتحت الخط بناءً على النص فقط
        =================================================== */
    .categories-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      overflow-x: auto;
      scroll-behavior: smooth;
      white-space: nowrap;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      scrollbar-width: none;
      gap: 12px;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      position: relative;
      background: none;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark, #333);
      cursor: pointer;
      transition: color 0.3s ease;
      flex-shrink: 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .category-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .category-btn.active {
      color: var(--primary, #0f2537);
      font-weight: 700;
    }

    .category-btn.active img {
      transform: scale(1.1);
    }

    .category-text-wrapper {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
    }

    .category-btn.active .category-text-wrapper::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3.5px;
      background-color: var(--primary, #0f2537);
      border-radius: 4px;
    }

    /* تطبيق لون الهيدر المخصص */
    .menu-header {
      background-color: var(--header-bg, transparent);
    }

    /* تطبيق لون العناوين المخصص */
    h1, h2, h3, h4, .brand-title, .sheet-header-title {
      color: var(--heading-color, inherit);
    }

    /* تطبيق لون نص الأزرار المخصص */
    button, .custom-btn {
      color: var(--button-text, inherit);
    }

    /* ===================================================
        تنسيقات الكارد المنبثق الموسط (Centered Modal)
        =================================================== */
    .bottom-sheet-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .bottom-sheet-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet-modal {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      transform: scale(0.9) translateY(0);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .bottom-sheet-overlay.active .bottom-sheet-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .sheet-close-btn {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
    }

    .sheet-close-btn:hover {
      background: rgba(0, 0, 0, 0.4);
      transform: scale(1.05);
    }

    .sheet-content {
      overflow-y: auto;
      padding: 18px;
      touch-action: pan-y;
    }

    .sheet-product-img {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 14px;
      display: block;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .sheet-header-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sheet-product-price {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary, #0f2537);
      margin-bottom: 10px;
    }

    .sheet-product-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #555;
      margin-bottom: 14px;
    }

    .sheet-section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sheet-ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ingredient-badge {
      background: rgba(0, 0, 0, 0.05);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #444;
    }
  </style>
</head>
<body class="menu-page">

  <!-- Banner Section -->
  <div class="hero-banner" id="banner-bg" style="width:100%; height:160px; background-size:cover; background-position:center; display:none;"></div>

  <!-- Header Section -->
  <header class="menu-header">
    <a href="index.html" class="header-menu-icon" aria-label="Home">
      <i class="fa-solid fa-house"></i>
    </a>

    <div class="brand-branding">
      <img id="brand-logo" src="" alt="Logo" style="max-height: 60px; display: none; margin: 0 auto 8px auto; border-radius: 50%;">
      <h1 class="brand-title" id="brand-title">YRmenu</h1>
      <div class="brand-divider" id="brand-tagline">SPECIALITY COFFEE</div>
    </div>
  </header>

  <!-- Horizontal Categories Bar -->
  <nav class="categories-bar" id="categories-nav">
    <!-- يتم بناء الأزرار تلقائياً عبر app.js -->
  </nav>

  <!-- Current Category Title -->
  <div class="section-header" style="display: none;">
    <h2 class="section-title" id="current-category-title">المنيو</h2>
  </div>

  <!-- Products Grid -->
  <main class="products-grid" id="menu-container">
    <!-- يتم عرض المنتجات تلقائياً عبر app.js -->
  </main>

  <!-- Center Modal (شاشة تفاصيل الوجبة) -->
  <div class="bottom-sheet-overlay" id="product-sheet-overlay">
    <div class="bottom-sheet-modal" id="product-sheet-modal">
      <button class="sheet-close-btn" id="sheet-close-btn" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="sheet-content">
        <img id="modal-product-img" class="sheet-product-img" src="" alt="Product Image" style="display:none;">
        <h3 id="modal-product-name" class="sheet-header-title"></h3>
        <div id="modal-product-price" class="sheet-product-price"></div>
        <p id="modal-product-desc" class="sheet-product-desc"></p>

        <div id="modal-ingredients-wrapper" style="display:none;">
          <div class="sheet-section-title" id="ingredients-label">المكونات:</div>
          <div id="modal-product-ingredients" class="sheet-ingredients-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Section -->
  <footer class="menu-footer">
    <div class="brand-badge">powered by YRmenu</div>
  </footer>

  <script>
    (function() {
      const pageLang = localStorage.getItem('selectedLang') || 'ar';
      document.documentElement.setAttribute('lang', pageLang);
      document.documentElement.setAttribute('dir', pageLang === 'en' ? 'ltr' : 'rtl');

      async function applyDynamicTheme() {
        try {
          const res = await fetch(`/api/settings?t=${new Date().getTime()}`, { cache: 'no-store' });
          if (!res.ok) return;
          const settings = await res.json();

          if (settings) {
            const status = (settings.subscriptionStatus || settings.status || settings.subscription_status || '').toLowerCase();
            const isActive = settings.isActive !== undefined ? settings.isActive : settings.is_active;
            const isDisabled = status === 'disabled' || status === 'inactive' || status === 'expired' || isActive === false || settings.disabled === true;

            const expiry = settings.expiryDate || settings.expiry_date || settings.expirationDate;
            let isExpired = false;
            if (expiry) {
              const today = new Date().toISOString().split('T')[0];
              const expiryFormatted = new Date(expiry).toISOString().split('T')[0];
              if (expiryFormatted < today) isExpired = true;
            }

            if (isDisabled || isExpired) {
              document.body.innerHTML = `
                <div style="text-align: center; padding: 50px 20px; font-family: system-ui, -apple-system, sans-serif; direction: ${pageLang === 'en' ? 'ltr' : 'rtl'}; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; color: #333;">
                  <h1 style="font-size: 48px; margin-bottom: 10px;">⚠️</h1>
                  <h2 style="color: #e74c3c; margin-bottom: 10px;">${pageLang === 'en' ? 'Sorry, service is currently unavailable' : 'عذراً، الخدمة غير متاحة حالياً'}</h2>
                  <p style="color: #666; max-width: 400px; line-height: 1.6;">${pageLang === 'en' ? 'The menu has been temporarily suspended due to subscription expiration or maintenance. Please contact management.' : 'تم إيقاف المنيو مؤقتاً بسبب انتهاء فترة الاشتراك أو للتعطيل الصيانة. يرجى مراجعة إدارة المطعم.'}</p>
                </div>`;
              return;
            }

            // تطبيق الألوان الأساسية
            const primaryColor = settings.primaryColor || '#0f2537';
            const secondaryColor = settings.secondaryColor || '#e5d5be';
            const cardBgColor = settings.cardBgColor || secondaryColor;
            const textColor = settings.textColor || '#1f1912';

            document.documentElement.style.setProperty('--primary', primaryColor);
            document.documentElement.style.setProperty('--secondary', secondaryColor);
            document.documentElement.style.setProperty('--card-bg', cardBgColor);
            document.documentElement.style.setProperty('--text-dark', textColor);
            document.documentElement.style.setProperty('--price-color', primaryColor);

            // تطبيق الألوان المتقدمة الجديدة المخصصة
            if (settings.headerBgColor) {
              document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
            }
            if (settings.headingColor) {
              document.documentElement.style.setProperty('--heading-color', settings.headingColor);
            }
            if (settings.cardBorderColor) {
              document.documentElement.style.setProperty('--card-border', settings.cardBorderColor);
            }
            if (settings.buttonTextColor) {
              document.documentElement.style.setProperty('--button-text', settings.buttonTextColor);
            }

            if (settings.restaurantName) {
              const nameText = typeof settings.restaurantName === 'object' ? (settings.restaurantName[pageLang] || settings.restaurantName.ar) : settings.restaurantName;
              const titleEl = document.getElementById('brand-title');
              if (titleEl) titleEl.innerText = nameText;
            }

            const taglineVal = settings.restaurantTagline || settings.restaurantSubtitle || settings.tagline;
            if (taglineVal) {
              const taglineText = typeof taglineVal === 'object' ? (taglineVal[pageLang] || taglineVal.ar) : taglineVal;
              const taglineEl = document.getElementById('brand-tagline');
              if (taglineEl) taglineEl.innerText = taglineText;
            }

            const logoEl = document.getElementById('brand-logo');
            if (logoEl) {
              if (settings.logoUrl) { logoEl.src = settings.logoUrl; logoEl.style.display = 'block'; }
              else { logoEl.style.display = 'none'; }
            }

            const bannerEl = document.getElementById('banner-bg');
            if (bannerEl) {
              if (settings.bannerUrl) { bannerEl.style.backgroundImage = `url('${settings.bannerUrl}')`; bannerEl.style.display = 'block'; }
              else { bannerEl.style.display = 'none'; }
            }
          }
        } catch (err) {
          console.error("فشل تطبيق الثيمة الديناميكية:", err);
        }
      }

      // إدارة المودال الموسط (شاشة التفاصيل)
      const overlay = document.getElementById('product-sheet-overlay');
      const modal = document.getElementById('product-sheet-modal');
      const closeBtn = document.getElementById('sheet-close-btn');

      window.openProductModal = function(product) {
        if (!product || !overlay || !modal) return;

        const name = typeof product.name === 'object' ? (product.name[pageLang] || product.name.ar) : product.name;
        const desc = typeof product.description === 'object' ? (product.description[pageLang] || product.description.ar) : product.description;

        document.getElementById('modal-product-name').innerText = name || '';
        document.getElementById('modal-product-price').innerText = product.price ? `${product.price}` : '';
        document.getElementById('modal-product-desc').innerText = desc || '';

        const imgEl = document.getElementById('modal-product-img');
        if (product.image || product.imageUrl) {
          imgEl.src = product.image || product.imageUrl;
          imgEl.style.display = 'block';
        } else {
          imgEl.style.display = 'none';
        }

        const ingredientsWrapper = document.getElementById('modal-ingredients-wrapper');
        const ingredientsContainer = document.getElementById('modal-product-ingredients');
        const ingredientsLabel = document.getElementById('ingredients-label');
        if (ingredientsLabel) ingredientsLabel.innerText = pageLang === 'en' ? 'Ingredients:' : 'المكونات:';

        if (product.ingredients && product.ingredients.length > 0) {
          ingredientsContainer.innerHTML = '';
          const list = Array.isArray(product.ingredients) ? product.ingredients : product.ingredients.split(',');
          list.forEach(ing => {
            const badge = document.createElement('span');
            badge.className = 'ingredient-badge';
            badge.innerText = ing.trim();
            ingredientsContainer.appendChild(badge);
          });
          ingredientsWrapper.style.display = 'block';
        } else {
          ingredientsWrapper.style.display = 'none';
        }

        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      };

      function closeProductModal() {
        if (!overlay || !modal) return;
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }

      if (closeBtn) closeBtn.addEventListener('click', closeProductModal);
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeProductModal();
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        applyDynamicTheme();
      });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
