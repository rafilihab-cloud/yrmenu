<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
     <link rel="icon" type="image/png" sizes="32x32" href="images/logo1.png">
<link rel="apple-touch-icon" href="images/logo1.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YRmenu - Menu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0f2537;
      --secondary: #e5d5be;
      --card-bg: #d7c4a8;
      --text-dark: #1f1912;
      --header-bg: #ffffff;
      --heading-color: #1a1a1a;
      --card-border: #cccccc;
      --button-text: #ffffff;
    }

    /* توحيد تصميم وتلوين أزرار الهيدر (زر الرئيسية وزر التقييم) تماماً */
    .header-menu-icon, .header-review-icon {
      background-color: rgba(0, 0, 0, 0.3) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 40px !important;
      height: 40px !important;
      border-radius: 50% !important;
      text-decoration: none !important;
      transition: background-color 0.2s !important;
      position: absolute !important;
      top: 16px !important;
      z-index: 3 !important;
    }

    .header-menu-icon i, .header-review-icon i {
      color: #ffffff !important;
    }

    .header-menu-icon:hover, .header-review-icon:hover {
      background-color: rgba(0, 0, 0, 0.5) !important;
    }

    /* 1. تطبيق لون النص العام على النصوص العادية والفقرات (مع استثناء الفوتر تماماً) */
    body, span:not(.menu-footer span), li, a:not(.header-menu-icon):not(.header-review-icon), label, div:not(.menu-footer div), .sheet-product-desc {
      color: var(--text-dark) !important;
    }

    /* حماية تامة لعبارة الفوتر والـ badge الخاصة بها لتبقى بلونها الافتراضي ولا تتأثر بلون النص العام */
    .menu-footer, .menu-footer *, .brand-badge {
      color: #666666 !important;
    }

    /* 2. جعل أسماء الأقسام تتبع لون النص العام (--text-dark) بناءً على طلبك */
    .category-btn, .category-text-wrapper {
      color: var(--text-dark) !important;
    }

    /* 3. تطبيق "لون العناوين والأسماء" على باقي العناصر المستهدفة (بما فيها وصف الصنف والوصف المنبثق) */
    h1, h2, h3, h4, h5, h6, 
    .sheet-header-title, 
    .section-title,
    .item-name,
    .product-name,
    .sheet-product-price,
    .price,
    [id*="name"],
    [id*="price"],
    .item-title,
    .product-title,
    .product-description,
    .sheet-product-desc {
      color: var(--heading-color) !important;
    }

    /* 4. عنوان البراند مستقل */
    .brand-title, 
    .brand-divider {
      color: var(--heading-color) !important;
    }

    /* تطبيق لون الهيدر الافتراضي */
    .menu-header {
      background-color: var(--header-bg) !important;
      position: relative;
      padding-top: 20px;
      padding-bottom: 20px;
      transition: background 0.3s ease;
    }

    /* تنسيق البانر بحيث يشمل الهيدر ويتحكم بخلفيته */
    .hero-banner {
      width: 100% !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
    }

    /* تطبيق لون حدود وتصميم كروت المنتجات */
    #menu-container > *, .menu-card, .item-card {
      border: 1px solid var(--card-border) !important;
      background-color: var(--card-bg) !important;
    }

    /* تطبيق لون نص الأزرار المخصص */
    button, .custom-btn, .order-btn {
      color: var(--button-text) !important;
    }

    @keyframes fadeInUpStagger {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #menu-container {
      perspective: 1000px;
      margin-top: 35px;
    }

    #menu-container > * {
      opacity: 0;
      animation: fadeInUpStagger 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--stagger-delay, 0s);
      will-change: transform, box-shadow, opacity;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      border-radius: 16px;
      cursor: pointer;
    }

    #menu-container > *:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.08);
      z-index: 2;
    }

    /* ===================================================
        تنسيقات شريط الأقسام الملتصق
        =================================================== */
    .categories-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      overflow-x: auto;
      scroll-behavior: smooth;
      white-space: nowrap;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      scrollbar-width: none;
      gap: 12px;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      position: relative;
      background: none;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s ease;
      flex-shrink: 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .category-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .category-btn.active {
      color: var(--primary, #0f2537) !important;
      font-weight: 700;
    }

    .category-btn.active img {
      transform: scale(1.1);
    }

    .category-text-wrapper {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
    }

    .category-btn.active .category-text-wrapper::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3.5px;
      background-color: var(--primary, #0f2537);
      border-radius: 4px;
    }

    /* ===================================================
        تنسيقات الكارد المنبثق الموسط (Centered Modal)
        =================================================== */
    .bottom-sheet-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .bottom-sheet-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .bottom-sheet-modal {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      transform: scale(0.9) translateY(0);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .bottom-sheet-overlay.active .bottom-sheet-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .sheet-close-btn {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
    }

    .sheet-close-btn:hover {
      background: rgba(0, 0, 0, 0.4);
      transform: scale(1.05);
    }

    .sheet-content {
      overflow-y: auto;
      padding: 18px;
      touch-action: pan-y;
    }

    .sheet-product-img {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 14px;
      display: block;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .sheet-header-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sheet-product-price {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .sheet-product-desc {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .sheet-section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sheet-ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ingredient-badge {
      background: rgba(0, 0, 0, 0.05);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body class="menu-page">

  <!-- Header Section مدمج داخل البانر ليأخذ خلفيته عند توفر صورة -->
  <div class="hero-banner" id="banner-bg">
    <header class="menu-header" id="menu-header">
      <a href="index.html" class="header-menu-icon" aria-label="Home">
        <i class="fa-solid fa-house"></i>
      </a>

      <!-- زر التقييم المحدث ليقود إلى صفحة feedback.html -->
      <a href="feedback.html" class="header-review-icon" id="reviewBtn" title="التقييم" aria-label="Review">
        <i class="fa-solid fa-star"></i>
      </a>

      <div class="brand-branding">
        <img id="brand-logo" src="" alt="Logo" style="max-height: 60px; display: none; margin: 0 auto 8px auto; border-radius: 50%;">
        <h1 class="brand-title" id="brand-title">YRmenu</h1>
        <div class="brand-divider" id="brand-tagline">SPECIALITY COFFEE</div>
      </div>
    </header>
  </div>

  <!-- Horizontal Categories Bar -->
  <nav class="categories-bar" id="categories-nav">
    <!-- يتم بناء الأزرار تلقائياً عبر app.js -->
  </nav>

  <!-- Current Category Title -->
  <div class="section-header" style="display: none;">
    <h2 class="section-title" id="current-category-title">المنيو</h2>
  </div>

  <!-- Products Grid -->
  <main class="products-grid" id="menu-container">
    <!-- يتم عرض المنتجات تلقائياً عبر app.js -->
  </main>

  <!-- Center Modal (شاشة تفاصيل الوجبة المنبثقة) -->
  <div class="bottom-sheet-overlay" id="product-sheet-overlay">
    <div class="bottom-sheet-modal" id="product-sheet-modal">
      <button class="sheet-close-btn" id="sheet-close-btn" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="sheet-content">
        <img id="modal-product-img" class="sheet-product-img" src="" alt="Product Image" style="display:none;">
        <h3 id="modal-product-name" class="sheet-header-title"></h3>
        <div id="modal-product-price" class="sheet-product-price"></div>
        <p id="modal-product-desc" class="sheet-product-desc"></p>

        <div id="modal-ingredients-wrapper" style="display:none;">
          <div class="sheet-section-title" id="ingredients-label">المكونات:</div>
          <div id="modal-product-ingredients" class="sheet-ingredients-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Section -->
  <footer class="menu-footer">
    <div class="brand-badge">
      powered by YRmenu
      <img src="images/logo1.png" alt="Icon" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle; margin-right: 6px; border-radius: 50%;">
    </div>
  </footer>

  <script>
    // دالة فتح نافذة تفاصيل الوجبة في منتصف الشاشة
    function openProductModal(productData) {
      const overlay = document.getElementById('product-sheet-overlay');
      
      const imgEl = document.getElementById('modal-product-img');
      const nameEl = document.getElementById('modal-product-name');
      const priceEl = document.getElementById('modal-product-price');
      const descEl = document.getElementById('modal-product-desc');
      const ingredientsWrapper = document.getElementById('modal-ingredients-wrapper');
      const ingredientsList = document.getElementById('modal-product-ingredients');

      if (nameEl) nameEl.innerText = productData.name || '';
      if (priceEl) priceEl.innerText = productData.price ? productData.price + '' : '';
      if (descEl) descEl.innerText = productData.description || '';

      if (imgEl) {
        if (productData.image) {
          imgEl.src = productData.image;
          imgEl.style.display = 'block';
        } else {
          imgEl.style.display = 'none';
        }
      }

      if (ingredientsWrapper && ingredientsList) {
        if (productData.ingredients && productData.ingredients.length > 0) {
          ingredientsList.innerHTML = productData.ingredients.map(ing => `<span class="ingredient-badge">${ing}</span>`).join('');
          ingredientsWrapper.style.display = 'block';
        } else {
          ingredientsWrapper.style.display = 'none';
        }
      }

      if (overlay) {
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('product-sheet-overlay');
      const closeBtn = document.getElementById('sheet-close-btn');

      function closeModal() {
        if (overlay) {
          overlay.classList.remove('active');
          document.body.style.overflow = 'auto';
        }
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', closeModal);
      }

      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            closeModal();
          }
        });
      }
    });

    (function() {
      const pageLang = localStorage.getItem('selectedLang') || 'ar';
      document.documentElement.setAttribute('lang', pageLang);
      document.documentElement.setAttribute('dir', pageLang === 'en' ? 'ltr' : 'rtl');

      let globalSettings = {};

      async function applyDynamicTheme() {
        try {
          const res = await fetch(`/api/settings?t=${new Date().getTime()}`, { cache: 'no-store' });
          if (!res.ok) return;
          const settings = await res.json();
          globalSettings = settings || {};

          if (settings) {
            const status = (settings.subscriptionStatus || settings.status || settings.subscription_status || '').toLowerCase();
            const isActive = settings.isActive !== undefined ? settings.isActive : settings.is_active;
            const isDisabled = status === 'disabled' || status === 'inactive' || status === 'expired' || isActive === false || settings.disabled === true;

            const expiry = settings.expiryDate || settings.expiry_date || settings.expirationDate;
            let isExpired = false;
            if (expiry) {
              const today = new Date().toISOString().split('T')[0];
              const expiryFormatted = new Date(expiry).toISOString().split('T')[0];
              if (expiryFormatted < today) isExpired = true;
            }

            if (isDisabled || isExpired) {
              document.body.innerHTML = `
                <div style="text-align: center; padding: 50px 20px; font-family: system-ui, -apple-system, sans-serif; direction: ${pageLang === 'en' ? 'ltr' : 'rtl'}; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; color: #333;">
                  <h1 style="font-size: 48px; margin-bottom: 10px;">⚠️</h1>
                  <h2 style="color: #e74c3c; margin-bottom: 10px;">${pageLang === 'en' ? 'Sorry, service is currently unavailable' : 'عذراً، الخدمة غير متاحة حالياً'}</h2>
                  <p style="color: #666; max-width: 400px; line-height: 1.6;">${pageLang === 'en' ? 'The menu has been temporarily suspended due to subscription expiration or maintenance. Please contact management.' : 'تم إيقاف المنيو مؤقتاً بسبب انتهاء فترة الاشتراك أو للتعطيل الصيانة. يرجى مراجعة إدارة المطعم.'}</p>
                </div>`;
              return;
            }

            const primaryColor = settings.primaryColor || '#0f2537';
            const secondaryColor = settings.secondaryColor || '#e5d5be';
            const cardBgColor = settings.cardBgColor || secondaryColor;
            const textColor = settings.textColor || '#1f1912';
            const headingColor = settings.headingColor || '#1a1a1a';

            document.documentElement.style.setProperty('--primary', primaryColor);
            document.documentElement.style.setProperty('--secondary', secondaryColor);
            document.documentElement.style.setProperty('--card-bg', cardBgColor);
            document.documentElement.style.setProperty('--text-dark', textColor);
            document.documentElement.style.setProperty('--heading-color', headingColor);

            if (settings.brandTitleColor) localStorage.setItem('cachedBrandTitleColor', settings.brandTitleColor);
            if (settings.descriptionColor) localStorage.setItem('cachedDescriptionColor', settings.descriptionColor);

            if (settings.headerBgColor) {
              document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
            }
            if (settings.cardBorderColor) {
              document.documentElement.style.setProperty('--card-border', settings.cardBorderColor);
            }
            if (settings.buttonTextColor) {
              document.documentElement.style.setProperty('--button-text', settings.buttonTextColor);
            }

            if (settings.restaurantName) {
              const nameText = typeof settings.restaurantName === 'object' ? (settings.restaurantName[pageLang] || settings.restaurantName.ar) : settings.restaurantName;
              const titleEl = document.getElementById('brand-title');
              if (titleEl) {
                titleEl.innerText = nameText;
              }
            }

            const taglineVal = settings.restaurantTagline || settings.restaurantSubtitle || settings.tagline;
            if (taglineVal) {
              const taglineText = typeof taglineVal === 'object' ? (taglineVal[pageLang] || taglineVal.ar) : taglineVal;
              const taglineEl = document.getElementById('brand-tagline');
              if (taglineEl) {
                taglineEl.innerText = taglineText;
              }
            }

            const logoEl = document.getElementById('brand-logo');
            if (logoEl) {
              if (settings.logoUrl) { logoEl.src = settings.logoUrl; logoEl.style.display = 'block'; }
              else { logoEl.style.display = 'none'; }
            }

            const bannerEl = document.getElementById('banner-bg');
            const headerEl = document.getElementById('menu-header');
            if (bannerEl && headerEl) {
              if (settings.bannerUrl) { 
                bannerEl.style.backgroundImage = `url('${settings.bannerUrl}')`; 
                headerEl.style.backgroundColor = 'transparent'; 
              } else { 
                bannerEl.style.backgroundImage = 'none';
                headerEl.style.backgroundColor = 'var(--header-bg)'; 
              }
            }

            forceApplyHeadingColor(settings);
          }
        } catch (err) {
          console.error("فشل تطبيق الثيمة الديناميكية:", err);
        }
      }

      function forceApplyHeadingColor(overrideSettings = {}) {
        const headingColor = getComputedStyle(document.documentElement).getPropertyValue('--heading-color').trim() || '#1a1a1a';
        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-dark').trim() || '#1f1912';

        const brandTitleColor = overrideSettings.brandTitleColor || globalSettings.brandTitleColor || localStorage.getItem('cachedBrandTitleColor') || headingColor;
        const descriptionColor = overrideSettings.descriptionColor || globalSettings.descriptionColor || localStorage.getItem('cachedDescriptionColor') || textColor;

        const brandTitleEl = document.getElementById('brand-title');
        if (brandTitleEl) {
          brandTitleEl.style.setProperty('color', brandTitleColor, 'important');
        }

        const taglineEl = document.getElementById('brand-tagline');
        if (taglineEl) {
          taglineEl.style.setProperty('color', descriptionColor, 'important');
        }
        
        document.querySelectorAll('.brand-divider').forEach(el => {
          el.style.setProperty('color', descriptionColor, 'important');
        });

        // ربط أسماء الأقسام بلون النص العام (--text-dark) حصرياً
        document.querySelectorAll('.category-btn, .category-text-wrapper').forEach(el => {
          el.style.setProperty('color', textColor, 'important');
        });

        const headingSelectors = [
          '.item-name',
          '.product-name',
          '.sheet-product-price',
          '.price',
          '[id*="price"]',
          '.product-price',
          '.section-title',
          '.sheet-header-title',
          '.product-description',     /* تم ربطه بلون العناوين والأسماء */
          '.sheet-product-desc',      /* تم ربطه بلون العناوين والأسماء */
          'h2', 'h3', 'h4', 'h5', 'h6'
        ];

        headingSelectors.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => {
            el.style.setProperty('color', headingColor, 'important');
          });
        });
      }

      const observer = new MutationObserver(() => {
        forceApplyHeadingColor();
      });

      window.addEventListener('DOMContentLoaded', () => {
        applyDynamicTheme();
        
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
      });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
