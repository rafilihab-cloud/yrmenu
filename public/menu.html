<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YRmenu - Menu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="menu-page">

  <!-- Header Section -->
  <header class="menu-header">
    <a href="index.html" class="header-menu-icon" aria-label="Home">
      <i class="fa-solid fa-house"></i>
    </a>

    <div class="brand-branding">
      <h1 class="brand-title">YRmenu</h1>
      <div class="brand-divider">SPECIALITY COFFEE</div>
    </div>

    <div class="header-actions">
      <button class="pill-btn"><i class="fa-regular fa-comment-dots"></i> <span id="feedback-btn-text">Feedback</span></button>
    </div>
  </header>

  <!-- Horizontal Categories Bar -->
  <nav class="categories-bar" id="categories-nav">
    <!-- يتم بناء الأقسام تلقائياً عبر JavaScript -->
  </nav>

  <!-- Current Category Title -->
  <div class="section-header">
    <h2 class="section-title" id="current-category-title">المنيو</h2>
  </div>

  <!-- Products Grid -->
  <main class="products-grid" id="menu-container">
    <!-- يتم عرض المنتجات تلقائياً عبر JavaScript -->
  </main>

  <script src="app.js"></script>
</body>
</html>
